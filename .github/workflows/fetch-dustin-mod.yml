name: Fetch Dustin mod assets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch-dustin-mod.yml'

permissions:
  contents: read

jobs:
  fetch-mod:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mobile project
        uses: actions/checkout@v4

      - name: Download the exact Game Jolt build
        shell: bash
        run: bash .github/scripts/fetch-dustin-mod.sh

      - name: Upload extracted mod as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dustin-mod-assets
          path: mods/Dustin/
          if-no-files-found: error
          retention-days: 14
